name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Compile and JAR
        run: |
          mkdir -p src/main/java/com/cheat
          mkdir -p build/classes
          echo 'package com.cheat; public class Cheat { public static void main(String[] args) { System.out.println("Cheat Mod"); } }' > src/main/java/com/cheat/Cheat.java
          javac -d build/classes src/main/java/com/cheat/Cheat.java
          cd build/classes
          jar cfe ../../cheat.jar com.cheat.Cheat com/cheat/Cheat.class
          cd ../..
      - uses: actions/upload-artifact@v4
        with:
          name: CheatJAR
          path: cheat.jar
