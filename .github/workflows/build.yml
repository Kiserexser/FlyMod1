name: Build Mod
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      
      - name: Setup Gradle
        run: |
          mkdir -p gradle/wrapper
          curl -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.8.0/gradle/wrapper/gradle-wrapper.jar
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.8-bin.zip" > gradle/wrapper/gradle-wrapper.properties
      
      - name: Build
        run: |
          chmod +x gradlew 2>/dev/null || true
          java -jar gradle/wrapper/gradle-wrapper.jar build --no-daemon
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ModJAR
          path: build/libs/*.jar
